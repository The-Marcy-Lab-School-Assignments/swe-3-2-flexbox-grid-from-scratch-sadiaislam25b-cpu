<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="app">
        <!-- Sidebar -->
        <nav class="sidebar">
            <h1 class="logo">Spotify</h1>

            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Search</a></li>
                <li><a href="#">Your Library</a></li>
            </ul>

            <ul class="playlists">
                <li>Playlist 1</li>
                <li>Playlist 2</li>
                <li>Playlist 3</li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="content">
            <header class="top-bar">
                <h2>Good Afternoon</h2>
            </header>

            <section class="albums">
                <article class="album-card">Album 1</article>
                <article class="album-card">Album 2</article>
                <article class="album-card">Album 3</article>
                <article class="album-card">Album 4</article>
                <article class="album-card">Album 5</article>
                <article class="album-card">Album 6</article>
            </section>
        </main>
    </div>

    <!-- Music Player -->
    <footer class="player">
        <div class="track-info">
            <p>Now Playing</p>
        </div>

        <div class="controls">
            <button>⏮</button>
            <button>▶</button>
            <button>⏭</button>
        </div>
    </footer>
</body>

</html>
