<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marcy Music</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <!-- Header -->
    <header class="top-bar">
        <div class="brand-icon">
            <img src="https://placehold.co/120x90/000000/ffffff?text=%F0%9F%93%80" alt="Turntable icon" />
        </div>

        <h1 class="logo">Marcy Music</h1>

        <nav class="main-nav">
            <ul>
                <li><a href="#">Library</a></li>
                <li><a href="#">Explore</a></li>
                <li><a href="#">Profile</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="content">
        <section class="playlists">
            <h2>Playlists</h2>

            <div class="playlist-grid">
                <article class="playlist-card">
                    <img src="https://placehold.co/100x100/1e1e1e/ffffff?text=Chill" alt="Chill Vibes cover" />
                    <span>Chill Vibes</span>
                </article>

                <article class="playlist-card">
                    <img src="https://placehold.co/100x100/1e1e1e/ffffff?text=Focus" alt="Focuss cover" />
                    <span>Focuss</span>
                </article>

                <article class="playlist-card">
                    <img src="https://placehold.co/100x100/1e1e1e/ffffff?text=Night" alt="Late Night cover" />
                    <span>Late Night</span>
                </article>

                <article class="playlist-card">
                    <img src="https://placehold.co/100x100/1e1e1e/ffffff?text=Love" alt="Love Songs cover" />
                    <span>Love Songs</span>
                </article>

                <article class="playlist-card">
                    <img src="https://placehold.co/100x100/1e1e1e/ffffff?text=Oldies" alt="Oldies cover" />
                    <span class="bold-text">Oldies</span>
                </article>

                <article class="playlist-card">
                    <img src="https://placehold.co/100x100/1e1e1e/ffffff?text=Sad" alt="Sad cover" />
                    <span>Sad</span>
                </article>
            </div>
        </section>

        <section class="albums">
            <h2>Albums</h2>

            <div class="album-grid">
                <article class="album-card">
                    <img src="https://placehold.co/180x180/1e1e1e/ffffff?text=Midnight" alt="Midnight Dreams album art" />
                    <h3>Midnight Dreams</h3>
                    <p>Luna Ray</p>
                </article>

                <article class="album-card">
                    <img src="https://placehold.co/180x180/1e1e1e/ffffff?text=Electric" alt="Electric Soul album art" />
                    <h3>Electric Soul</h3>
                    <p>The Voltage</p>
                </article>

                <article class="album-card">
                    <img src="https://placehold.co/180x180/1e1e1e/ffffff?text=Golden" alt="Golden Hour album art" />
                    <h3>Golden Hour</h3>
                    <p>Sunset Collective</p>
                </article>

                <article class="album-card album-card--rounded">
                    <img src="https://placehold.co/180x180/1e1e1e/1db954?text=Kermit" alt="Kermit Does Jazz album art" />
                    <h3>Kermit Does Jazz</h3>
                    <p>Kermit the Frog</p>
                </article>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <p>Made with &#10084;&#65039; at <span class="brand-highlight">Marcy Lab School</span></p>
    </footer>
</body>

</html>
